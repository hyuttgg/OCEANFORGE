name: OceanForge Nightly

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_PATH: OceanForge.slnx

jobs:
  full-validation:
    name: Full nightly build & test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: oceanforge_test
          MYSQL_USER: oceanforge_test_user
          MYSQL_PASSWORD: test-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        shell: pwsh
        run: dotnet restore "$env:SOLUTION_PATH" --locked-mode

      - name: Build Release
        shell: pwsh
        run: dotnet build "$env:SOLUTION_PATH" -c Release --no-restore

      - name: Run all tests
        shell: pwsh
        run: dotnet test "$env:SOLUTION_PATH" -c Release --no-build --logger trx

      - name: Verify MySQL 8.4 clean schema migration
        shell: bash
        run: bash database/scripts/verify-migrations.sh

      - name: NuGet audit
        shell: pwsh
        run: dotnet list "$env:SOLUTION_PATH" package --vulnerable --include-transitive

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-test-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn
          retention-days: 14
